<div class="container">
  <div class="d-inline-flex justify-content-between align-items-center  " *ngFor="let vi of videos">
    <div class="card m-3" appHiLightDirective [appHiLight]="vi.likes === mostLikeVideo.likes" style="width: 18rem;">
      <div>
        <img [src]="vi.thumbnail" alt="video-image" class="card-img-top" width="200" height="200">

      </div>
      <div class="card-header text-center">{{ vi.title.toUpperCase() }}</div>
      <div class="card-body d-flex">
        <p [ngStyle]="{color: vi.likes ? 'green' : 'red'}">Thumbs up: {{ vi.likes }}</p>
        <p [ngStyle]="{color: vi.disLike ? 'red' : 'green'}">Thumbs down: {{ vi.disLike }}</p>
        <p [ngStyle]="{color: vi.share ? 'blue' : ''}">Share: {{ vi.share }}</p>
      </div>
    </div>
  </div>
</div>
